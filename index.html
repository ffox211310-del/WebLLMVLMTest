<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>軽量 画像認識 - transformers.js</title>
<style>
 body{font-family:system-ui;max-width:720px;margin:24px auto;padding:16px}
 #preview{max-width:100%;border-radius:12px;display:none;margin:12px 0}
 #output{background:#111;color:#eee;padding:14px;border-radius:8px;white-space:pre-wrap}
 button{padding:10px 16px;border-radius:8px;background:#4f46e5;color:#fff;border:none}
</style>
<script type="importmap">
{
  "imports": {
    "@huggingface/transformers": "https://esm.run/@huggingface/transformers@3.7.0"
  }
}
</script>
</head>
<body>
<h3>画像認識 - 完全ブラウザ内 / 50MB</h3>
<div id="status">モデル準備中...</div>
<input type="file" id="file" accept="image/*">
<img id="preview">
<br>
<button id="run" disabled>認識する</button>
<div id="output"></div>

<script type="module">
import { pipeline, env } from "@huggingface/transformers";
// キャッシュ有効化
env.allowLocalModels = false;

const status = document.getElementById('status');
const fileInput = document.getElementById('file');
const preview = document.getElementById('preview');
const runBtn = document.getElementById('run');
const output = document.getElementById('output');

let imageEl = null;
let classifier, captioner;

// 軽量モデル2つをロード
// 1. 分類: MobileNetV2 (14MB) - 猫/犬/車などが1000ラベルで出る
// 2. 説明文: vit-gpt2 (300MB) - 画像を文章で説明
status.textContent = "モデルDL中...初回のみ300MB程度";
classifier = await pipeline('image-classification', 'Xenova/mobilenet_v2_1.0_224', { device: 'webgpu', dtype: 'fp32' }).catch(async ()=> {
  // webgpu非対応ならwasmにフォールバック
  return await pipeline('image-classification', 'Xenova/mobilenet_v2_1.0_224');
});
captioner = await pipeline('image-to-text', 'Xenova/vit-gpt2-image-captioning', { device: 'webgpu' }).catch(async ()=>{
  return await pipeline('image-to-text', 'Xenova/vit-gpt2-image-captioning');
});

status.textContent = "準備完了！画像を選んでください";
runBtn.disabled = false;

fileInput.onchange = e => {
  const file = e.target.files[0];
  if(!file) return;
  const url = URL.createObjectURL(file);
  preview.src = url;
  preview.style.display = 'block';
  imageEl = preview;
};

runBtn.onclick = async () => {
  if(!imageEl) return;
  runBtn.disabled = true;
  output.textContent = "推論中...";

  const [labels, caption] = await Promise.all([
    classifier(imageEl, { topk: 5 }),
    captioner(imageEl)
  ]);

  let text = `【キャプション】\n${caption[0].generated_text}\n\n【分類TOP5】\n`;
  labels.forEach(l => {
    text += `- ${l.label}: ${(l.score*100).toFixed(1)}%\n`;
  });
  output.textContent = text;
  runBtn.disabled = false;
};
</script>
</body>
</html>
