<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WebLLM Vision Demo</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 24px auto; padding: 16px; }
  #preview { max-width: 100%; max-height: 400px; margin-top: 12px; border-radius: 12px; display: none; }
  #status { background: #f5f5f5; padding: 10px; border-radius: 8px; white-space: pre-wrap; font-size: 14px; }
  #output { background: #111; color: #eee; padding: 14px; border-radius: 8px; min-height: 80px; white-space: pre-wrap; }
  button { padding: 10px 16px; border-radius: 8px; border: none; background: #4f46e5; color: white; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: 0.5; }
  input, select { margin: 8px 0; }
</style>
<script type="importmap">
{
  "imports": {
    "@mlc-ai/web-llm": "https://esm.run/@mlc-ai/web-llm@0.2.79"
  }
}
</script>
</head>
<body>
<h2>WebLLMで画像認識 - ブラウザ内で完結</h2>
<p>モデル: <select id="modelSelect">
  <option value="Phi-3.5-vision-instruct-q4f16_1-MLC">Phi-3.5-vision (軽量・推奨 4GB)</option>
  <option value="LLaVA-1.5-7B-q4f32_1-MLC">LLaVA-1.5-7B (高精度)</option>
  <option value="Qwen2-VL-2B-Instruct-q4f16_1-MLC">Qwen2-VL-2B (最軽量)</option>
</select></p>

<div id="status">モデル未ロード。Chrome / Edge 最新版でWebGPUを有効にしてください。</div>
<input type="file" id="fileInput" accept="image/*" />
<img id="preview" />
<br><br>
<textarea id="prompt" rows="2" style="width:100%">この画像に何が写っているか、日本語で詳しく説明して。写っている物体をリストアップして。</textarea>
<br><br>
<button id="runBtn" disabled>画像を認識する</button>

<h3>結果:</h3>
<div id="output"></div>

<script type="module">
import { CreateMLCEngine } from "@mlc-ai/web-llm";

const statusEl = document.getElementById("status");
const fileInput = document.getElementById("fileInput");
const previewEl = document.getElementById("preview");
const runBtn = document.getElementById("runBtn");
const outputEl = document.getElementById("output");
const modelSelect = document.getElementById("modelSelect");
const promptEl = document.getElementById("prompt");

let engine = null;
let imageDataUrl = null;

// WebGPUチェック
if (!navigator.gpu) {
  statusEl.textContent = "このブラウザはWebGPU非対応です。Chrome 113+ / Edge 113+ を使ってください。";
}

async function initEngine() {
  const model = modelSelect.value;
  statusEl.textContent = `モデル ${model} をダウンロード中...初回は2-4GBで時間かかります`;
  runBtn.disabled = true;

  engine = await CreateMLCEngine(model, {
    initProgressCallback: (report) => {
      statusEl.textContent = `${report.text}\n${Math.round(report.progress*100)}%`;
    }
  });
  statusEl.textContent = `準備完了: ${model}`;
  runBtn.disabled =!imageDataUrl;
}

modelSelect.addEventListener("change", initEngine);
initEngine(); // 起動時にロード

fileInput.addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    imageDataUrl = reader.result; // data:image/jpeg;base64,...
    previewEl.src = imageDataUrl;
    previewEl.style.display = "block";
    if (engine) runBtn.disabled = false;
  };
  reader.readAsDataURL(file);
});

runBtn.addEventListener("click", async () => {
  if (!engine ||!imageDataUrl) return;
  runBtn.disabled = true;
  outputEl.textContent = "推論中...";

  try {
    // WebLLMのVision APIは OpenAI互換。contentに image_url を入れる
    const chunks = await engine.chat.completions.create({
      stream: true,
      messages: [
        {
          role: "user",
          content: [
            { type: "text", text: promptEl.value },
            { type: "image_url", image_url: { url: imageDataUrl } }
          ]
        }
      ],
      max_tokens: 500,
    });

    let fullText = "";
    for await (const chunk of chunks) {
      const delta = chunk.choices[0]?.delta?.content?? "";
      fullText += delta;
      outputEl.textContent = fullText;
    }
  } catch (err) {
    outputEl.textContent = "エラー: " + err.message;
    console.error(err);
  } finally {
    runBtn.disabled = false;
  }
});
</script>
</body>
</html>
